services:
  app:
    volumes: &appvolumes
      - ./src:/var/www/html:cached
      - ./src/nginx.conf.sample:/var/www/html/nginx.conf:cached
    env_file:
      - env/phpfpm.env
      - env/custom.env

  phpfpm:
    volumes: *appvolumes
    env_file:
      - env/phpfpm.env
      - env/custom.env

  react:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src/react-frontend:/app:cached
      - ./src/pub/react:/pub/react
    command: sh -c "npm install --prefer-offline && npx vite build && npx vite build --watch"
    environment:
      - NODE_ENV=development

  phpmyadmin:
    image: linuxserver/phpmyadmin
    env_file: env/db.env
    environment:
      - PMA_HOST=db
      - PMA_USER=magento
      - PMA_PASSWORD=magento
    ports:
      - "8080:80"
    depends_on:
      - db

services:
  app:
    volumes: &appvolumes
      - ./src:/var/www/html:cached
      - ./src/nginx.conf:/var/www/html/nginx.conf:cached
    env_file:
      - env/phpfpm.env
      - env/custom.env

  phpfpm:
    volumes: *appvolumes
    env_file:
      - env/phpfpm.env
      - env/custom.env

  react:
    build:
      context: ./src/react-frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./src/react-frontend:/app:cached
      - /app/node_modules
      - ./src/pub/react:/pub/react
    command: sh -c "npm run build && npm run build -- --watch"
    environment:
      - NODE_ENV=production

  phpmyadmin:
    image: linuxserver/phpmyadmin
    env_file: env/db.env
    environment:
      - PMA_HOST=db
      - PMA_USER=magento
      - PMA_PASSWORD=magento
    ports:
      - "8080:80"
    depends_on:
      - db
